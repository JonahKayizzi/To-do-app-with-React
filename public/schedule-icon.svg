<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Calendar background -->
  <rect x="8" y="12" width="48" height="44" rx="4" ry="4" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Calendar header -->
  <rect x="8" y="12" width="48" height="12" rx="4" ry="4" fill="#1e40af"/>
  
  <!-- Binding rings -->
  <rect x="18" y="6" width="3" height="12" rx="1.5" ry="1.5" fill="#6b7280"/>
  <rect x="43" y="6" width="3" height="12" rx="1.5" ry="1.5" fill="#6b7280"/>
  
  <!-- Calendar grid lines -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="16" y1="40" x2="48" y2="40" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="16" y1="48" x2="48" y2="48" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="24" x2="24" y2="52" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="32" y1="24" x2="32" y2="52" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="24" x2="40" y2="52" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Calendar dots (representing events/tasks) -->
  <circle cx="20" cy="36" r="2" fill="#ef4444"/>
  <circle cx="28" cy="28" r="2" fill="#10b981"/>
  <circle cx="36" cy="44" r="2" fill="#f59e0b"/>
  <circle cx="44" cy="36" r="2" fill="#8b5cf6"/>
  
  <!-- Clock icon (schedule element) -->
  <circle cx="50" cy="18" r="8" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  <line x1="50" y1="14" x2="50" y2="18" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="18" x2="53" y2="20" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
</svg>
